<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARATH DÍAZ | Psicología Canina</title>

<style>

body{
margin:0;
background:#FFFFFF;
font-family:'Poppins',Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

width:90%;
max-width:430px;

background:white;

border-radius:25px;

padding:35px;

box-shadow:0 10px 35px rgba(0,0,0,.15);

text-align:center;

}

.logo{

width:250px;

height:auto;

display:block;

margin:0 auto 20px auto;

}
  
h1{

margin:0;

font-size:30px;

color:#222;

}

h2{

margin-top:5px;

font-weight:400;

color:#CDA861;

}

p{

color:#666;

margin-bottom:30px;

}

button{

width:100%;

padding:17px;

margin:10px 0;

font-size:18px;

border:none;

border-radius:15px;

background:#1F4E5F;

color:white;

cursor:pointer;

transition:.25s;

box-shadow:0 8px 20px rgba(31,78,95,.25);

}

button:hover{

background:#163A47;

transform:translateY(-3px);

}

button:active{

transform:scale(.96);

box-shadow:0 3px 10px rgba(31,78,95,.20);

}

</style>

</head>

<body>

<div class="card">

<img src="logo.png" alt="ARATH DÍAZ Psicología Canina" class="logo">

<p>Elige el servicio que mejor se adapte a las necesidades de tu perro o a tu proceso personal.</p>

<button onclick="abrir('paseo recreativo')">
🐕 Paseo recreativo
</button>

<button onclick="abrir('paseo correctivo')">
🦮 Paseo correctivo
</button>

<button onclick="abrir('obediencia')">
🐶 Obediencia básica
</button>

<button onclick="abrir('apoyo psicológico')">
🧠 Apoyo psicológico a personas
</button>

</div>

<script>

function abrir(servicio){

let numero="5212222385400";

let mensaje="Hola! Quisiera, por favor, recibir información sobre "+servicio;

window.open("https://wa.me/"+numero+"?text="+encodeURIComponent(mensaje),"_blank");

}

</script>

</body>
</html>
